[package]
name = "jj-ci-lifecycle"
version = "0.1.0"
edition = "2021"
description = "The `ci` topic lifecycle from JjCi.tla as an executable statig state machine"
license = "MIT"
publish = false

[[bin]]
name = "jj-ci-lifecycle"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
statig = "0.4.1"
