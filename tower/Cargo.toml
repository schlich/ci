[package]
name = "ci-tower"
version = "0.1.0"
edition = "2021"
description = "A live terminal control tower for the `ci` topic workflow"
license = "MIT"
publish = false

[[bin]]
name = "ci-tower"
path = "src/main.rs"

[dependencies]
jj-ci-lifecycle = { path = "../lifecycle" }
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
